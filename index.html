<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
        header{
            background-color: #C7B6EA ;
            color: #1B2C3A;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        main{
            background-color: #ffffff;
            color:#581C83;;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }
        img{
            width: 150px;
            height: 150px;

        }
        .artigo-autor {
            font-weight: bold;
        }
        </style>
    </head>
    <body>
    <header>
         <h1>Meu blog biologico</h1>
         <p>Vou compartilhar conhecimentos sobre biologia </p>
    </header>
    <main>
            <img src="imagem-animais.png" alt=" uma imagem de slihueta de um gato com o fundo cinza">
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Isabella</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar coisas da biologia animal e curiosidades da área de biologia animais.</p>
                <button>💖 <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
    </main>
    </body>
    <script>
        const botao = document.querySelectorAll("button");
        botao.addEventListener("click", botaoClicado);
        
        function botaoClicado(){
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    </script>
</html>
